<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to JSON Converter</title>
    <link rel="icon" type="image/x-icon" href="Assets/Icons/Logo.png">
    <link rel="stylesheet" href="Scripts/SAP_Main.css">
</head>

<body>
    <script src="https://elmerf5445.github.io/ERUMA-UI/Scripts/Javascript/App_Javascript_ERUMAUI.js"></script>
    <script src="https://elmerf5445.github.io/ERUMA-UI/Scripts/Javascript/App_Javascript_ERUMAUI_Core.js"></script>
    <div class="Page_Content">
        <div class="MenuBar" State="Collapsed" id="Sidebar">
          <div class="MenuBar_List">
            <button class="MenuBar_List_Item" onclick="Page_ChangePage('index.html')">
              <img class='MenuBar_List_Item_Icon' src='Assets/Icons/Home.png' draggable='false' loading='lazy' />
              <span class="MenuBar_List_Item_Indicator">
              </span>
              <p class="MenuBar_List_Item_Text">
                Home
              </p>
            </button>
            <button class="MenuBar_List_Item" onclick="Page_ChangePage('about.html')">
              <img class='MenuBar_List_Item_Icon' src='Assets/Icons/About_1.png' draggable='false' loading='lazy' />
              <span class="MenuBar_List_Item_Indicator">
              </span>
              <p class="MenuBar_List_Item_Text">
                About
              </p>
            </button>
          </div>
        </div>
        <div class="Page_Content_Main" id="Content">
            <div class="FC_Title">
                <h1>Excel to JSON Converter</h1>
            </div>        
            <div class="FC">
                <div class="FC_Controls">
                    <button class="General_Button">
                        <label for="fileInput">Choose Excel File</label>
                    </button>
                    <input class="FC_Controls_Input" style="display: none" type="file" id="fileInput" accept=".xls, .xlsx" onchange="displayFileName()">
                    <button onclick="convertToJSON()" class="General_Button">Convert to JSON</button>
                    <button id="copyButton" class="General_Button" onclick="copyToClipboard()">Copy</button>
                    <h3 class="General_Title">
                        Include:
                    </h3>
                    <label><input type="checkbox" id="questionCheckbox" checked>Question</label>
                    <label><input type="checkbox" id="correctAnswerCheckbox" checked>Correct Answer</label>
                    <label><input type="checkbox" id="choicesCheckbox" checked>Choices</label>
                    <label><input type="checkbox" id="referenceCheckbox" checked>Reference</label>
                    <label><input type="checkbox" id="termCheckbox" checked>Term</label>
                    <label><input type="checkbox" id="statusCheckbox" unchecked>Status</label>
                </div>
                <div class="FC_Output">
                    <div class="FC_Output_Status">
                        <div id="fileLabel"></div>
                        <div id="convertMode"></div>
                        <div id="copyMessage" style="display: none;">Data copied successfully!</div>
                    </div>
                    <div class="FC_Output_Container">
                        <div id="jsonOutputContainer">
                            <pre id="jsonOutput"></pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    

    <script>
        
function FC_Header_Key(value) {
    return String(value == null ? "" : value).trim().toLowerCase().replace(/[\s_-]+/g, "");
}

// Named import is used only when the header row actually contains questionText and option1.
// Every other sheet keeps the original positional columns.
function FC_Named_Columns(headerRow) {
    if (!headerRow || !headerRow.length) return null;
    const columns = {};
    for (let i = 0; i < headerRow.length; i++) {
        const key = FC_Header_Key(headerRow[i]);
        if (key && columns[key] === undefined) columns[key] = i;
    }
    if (columns.questiontext === undefined || columns.option1 === undefined) {
        return null;
    }
    const options = [];
    ["option1", "option2", "option3", "option4"].forEach(function (name) {
        if (columns[name] !== undefined) options.push(columns[name]);
    });
    return {
        question: columns.questiontext,
        answer: columns.answer !== undefined ? columns.answer : -1,
        options: options,
        reference: columns.reference !== undefined ? columns.reference : -1,
        term: columns.term !== undefined ? columns.term : -1,
        status: columns.status !== undefined ? columns.status : -1
    };
}

function FC_Cell(row, index) {
    if (index < 0 || !row || index >= row.length) return undefined;
    return row[index];
}

function FC_Convert_Sheet_Rows(jsonData, flags) {
    const named = FC_Named_Columns(jsonData[0] || []);
    const convertedData = [];

    for (let i = 1; i < jsonData.length; i++) {
        const row = jsonData[i];
        if (!row || row.every(function (cell) {
            return cell === null || cell === undefined || cell === "";
        })) {
            continue;
        }

        const preprocessedRow = row.map(function (cell) {
            if (typeof cell === "string") {
                return cell.replace(/\b(TRUE|FALSE)\b/g, "$1 ");
            }
            return cell;
        });

        const convertedRow = {};
        if (flags.question) {
            convertedRow.question = named ? FC_Cell(preprocessedRow, named.question) : preprocessedRow[0];
        }
        if (flags.answer) {
            convertedRow.answer = named ? FC_Cell(preprocessedRow, named.answer) : preprocessedRow[1];
        }
        if (flags.choices) {
            const choices = [];
            if (named) {
                named.options.forEach(function (index) {
                    const value = FC_Cell(preprocessedRow, index);
                    if (value) choices.push(value);
                });
            } else {
                for (let j = 2; j < 6; j++) {
                    if (preprocessedRow[j]) choices.push(preprocessedRow[j]);
                }
            }
            convertedRow.choices = choices;
        }
        if (flags.reference) {
            convertedRow.reference = named ? FC_Cell(preprocessedRow, named.reference) : preprocessedRow[6];
        }
        if (flags.term) {
            convertedRow.term = named ? FC_Cell(preprocessedRow, named.term) : preprocessedRow[7];
        }
        if (flags.status) {
            convertedRow.status = named ? FC_Cell(preprocessedRow, named.status) : preprocessedRow[8];
        }
        convertedData.push(convertedRow);
    }

    return { mode: named ? "named" : "legacy", rows: convertedData };
}

function convertToJSON() {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    const modeLabel = document.getElementById('convertMode');
    if (!file) {
        modeLabel.innerText = "Choose an Excel file first.";
        return;
    }
    const reader = new FileReader();

    reader.onerror = function () {
        modeLabel.innerText = "That Excel file could not be read.";
    };

    reader.onload = function (e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });

            // Assuming the first sheet is the one you want to convert
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];

            // Convert sheet to JSON
            const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            const flags = {
                question: document.getElementById('questionCheckbox').checked,
                answer: document.getElementById('correctAnswerCheckbox').checked,
                choices: document.getElementById('choicesCheckbox').checked,
                reference: document.getElementById('referenceCheckbox').checked,
                term: document.getElementById('termCheckbox').checked,
                status: document.getElementById('statusCheckbox').checked
            };
            const result = FC_Convert_Sheet_Rows(jsonData, flags);

            document.getElementById('jsonOutput').innerText = JSON.stringify(result.rows, null, 2);
            modeLabel.innerText = result.mode === "named"
                ? "Imported using column names (questionText, option1, option2, option3, option4, answer)."
                : "Imported using the legacy column layout.";
        } catch (error) {
            document.getElementById('jsonOutput').innerText = "";
            modeLabel.innerText = "This workbook could not be converted. Use the original column layout, or headers named questionText, option1, option2, option3, option4, and answer.";
        }
    };

    reader.readAsArrayBuffer(file);
}
        function displayFileName() {
            const fileLabel = document.getElementById('fileLabel');
            const fileInput = document.getElementById('fileInput');
            fileLabel.innerText = "Filename: " + fileInput.files[0].name;
        }

        function copyToClipboard() {
            const jsonOutput = document.getElementById('jsonOutput');
            if (!jsonOutput.innerText.trim()) {
                // Display message indicating no data to copy
                const copyMessage = document.getElementById('copyMessage');
                copyMessage.innerText = 'No data to copy. Please convert an Excel file first.';
                copyMessage.style.color = 'red';
                copyMessage.style.display = 'block';
                setTimeout(function () {
                    copyMessage.style.display = 'none';
                }, 2000); // Hide the message after 2 seconds
                return;
            }

            const textArea = document.createElement('textarea');
            textArea.value = jsonOutput.innerText;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

            // Display success message
            const copyMessage = document.getElementById('copyMessage');
            copyMessage.innerText = 'Data copied successfully!';
            copyMessage.style.color = 'green';
            copyMessage.style.display = 'block';
            setTimeout(function () {
                copyMessage.style.display = 'none';
            }, 2000); // Hide the message after 2 seconds
        }


    </script>
    <!-- Include the XLSX library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.1/xlsx.full.min.js"></script>
</body>

</html>
